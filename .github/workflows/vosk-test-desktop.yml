name: vosk-test desktop

# Runs ideas/python-android/vosk-test's transcription with the wheel built by the Vosk fork's CI.
on:
  workflow_dispatch:
  push:
    paths:
      - 'ideas/python-android/vosk-test/ci/desktop_check.py'
      - 'ideas/python-android/vosk-test/main.py'
      - 'ideas/python-android/vosk-test/data/**'
      - 'ideas/python-android/vosk-test/ci/check_result.sh'
      - 'ideas/python-android/vosk-test/ci/fetch_vosk_binaries.sh'
      - '.github/workflows/vosk-test-desktop.yml'

env:
  APP_DIR: ideas/python-android/vosk-test

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x86_64
            runner: ubuntu-latest
            artifact: vosk-linux-x86_64
            wheel: '*manylinux*.whl'
          - os: windows-x64
            runner: windows-latest
            artifact: vosk-windows-x64
            wheel: '*win_amd64.whl'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch the vosk wheel built by the vosk-api fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: $APP_DIR/ci/fetch_vosk_binaries.sh ${{ matrix.artifact }} "$RUNNER_TEMP/wheelhouse"

      - name: Install kivy and the vosk wheel
        run: pip install kivy "$(ls "$RUNNER_TEMP"/wheelhouse/${{ matrix.wheel }} | head -1)"

      - name: Download the small English model
        working-directory: ${{ env.APP_DIR }}
        run: |
          curl -fsSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o model.zip
          python -m zipfile -e model.zip .
          mv vosk-model-small-en-us-0.15 data/model
          rm model.zip

      - name: Transcribe the test file
        working-directory: ${{ env.APP_DIR }}
        env:
          KIVY_NO_ARGS: '1'
        run: python ci/desktop_check.py | ci/check_result.sh
