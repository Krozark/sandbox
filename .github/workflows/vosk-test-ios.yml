name: vosk-test iOS

# Builds ideas/python-android/vosk-test for the iOS Simulator with kivy-ios, using the Vosk fork
# (libvosk built from its master by ios/build_libvosk.sh), and runs it in a simulator.
on:
  workflow_dispatch:
  push:
    paths:
      - 'ideas/python-android/vosk-test/ios/**'
      - 'ideas/python-android/vosk-test/main.py'
      - 'ideas/python-android/vosk-test/data/**'
      - 'ideas/python-android/vosk-test/ci/check_result.sh'
      - 'ideas/python-android/vosk-test/ci/fetch_vosk_binaries.sh'
      - '.github/workflows/vosk-test-ios.yml'

env:
  APP_DIR: ${{ github.workspace }}/ideas/python-android/vosk-test
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Krozark/vosk-api
          path: vosk-api

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config
          pip install kivy-ios

      - name: Build libvosk.xcframework (simulator slice)
        run: SLICES=simulator vosk-api/ios/build_libvosk.sh "$BUILD_DIR/libvosk"

      - name: Download the small English model
        working-directory: ideas/python-android/vosk-test
        run: |
          curl -fsSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o model.zip
          unzip -q model.zip
          mv vosk-model-small-en-us-0.15 data/model
          rm model.zip

      - name: Build the kivy-ios distribution
        working-directory: ${{ env.BUILD_DIR }}
        env:
          LIBVOSK_XCFRAMEWORK: ${{ env.BUILD_DIR }}/libvosk/libvosk.xcframework
        run: |
          toolchain build python3 kivy cffi vosk --platform iphonesimulator-arm64 \
            --add-custom-recipe "$APP_DIR/ios/recipes/cffi" \
            --add-custom-recipe "$APP_DIR/ios/recipes/vosk"

      - name: Create the Xcode project and build the app
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          toolchain create VoskTest "$APP_DIR"
          xcodebuild -project vosktest-ios/vosktest.xcodeproj -scheme vosktest \
            -sdk iphonesimulator -configuration Debug -derivedDataPath derived \
            CODE_SIGNING_ALLOWED=NO build

      - name: Run in the iOS Simulator
        run: |
          app="$(find "$BUILD_DIR/derived" -name '*.app' -path '*iphonesimulator*' | head -1)"
          "$APP_DIR/ios/smoke_test.sh" "$app" "$BUILD_DIR/out"

      - name: Upload screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vosk-test-ios
          path: build/out/
